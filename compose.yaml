services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_DB: pmstudio, POSTGRES_USER: pmstudio, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}" }
    volumes: ["postgres-data:/var/lib/postgresql/data", "./infra/migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pmstudio"], interval: 10s, timeout: 5s, retries: 5 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}" }
    volumes: ["object-data:/data"]
  web:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment: { DATABASE_URL: "postgres://pmstudio:${POSTGRES_PASSWORD}@postgres:5432/pmstudio", S3_ENDPOINT: http://minio:9000, S3_ACCESS_KEY: "${MINIO_ROOT_USER}", S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD}" }
    depends_on: { postgres: { condition: service_healthy } }
  worker:
    build: .
    command: ["pnpm", "--filter", "@pm-studio/worker", "dev"]
    env_file: .env
    environment: { DATABASE_URL: "postgres://pmstudio:${POSTGRES_PASSWORD}@postgres:5432/pmstudio", S3_ENDPOINT: http://minio:9000, S3_ACCESS_KEY: "${MINIO_ROOT_USER}", S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD}" }
    depends_on: { postgres: { condition: service_healthy } }
volumes: { postgres-data: {}, object-data: {} }
